<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Public Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">

    <div id="global-loader" class="loading-overlay hidden">
        <div class="flex flex-col items-center gap-3">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-xs font-bold text-slate-500">処理中...</p>
        </div>
    </div>

    <header class="bg-white/90 backdrop-blur-lg border-b border-slate-200 sticky top-0 z-30 h-14 shadow-sm">
        <div class="max-w-full mx-auto px-4 h-full flex items-center justify-between">
            <h1 class="text-sm font-black text-slate-800 uppercase italic">Bulletin Board System</h1>
            <div id="auth-header-btn">
                <button onclick="showLoginModal(true)" class="text-xs font-bold bg-slate-100 text-slate-600 px-4 py-2 rounded-full">ログイン</button>
            </div>
        </div>
    </header>

    <main class="max-w-full mx-auto px-2 py-4 sm:px-4 flex flex-col lg:flex-row gap-6 h-[calc(100vh-60px)] overflow-hidden">
        <div class="flex-1 min-w-0 overflow-y-auto pr-2">
            <section id="gallery-container">
                <div id="post-grid" class="grid grid-cols-2 md:grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-3 sm:gap-6 justify-center"></div>
            </section>
        </div>

        <aside id="pc-side-panel" class="hidden lg:block shrink-0 relative bg-white rounded-3xl transition-all duration-300 ease-in-out border border-slate-200 shadow-sm" style="width: 60px;">
            <div id="panel-resizer" class="absolute -left-4 top-0 bottom-0 w-8 cursor-col-resize z-50 flex items-center justify-center">
                <div class="w-1 h-24 bg-slate-200 rounded-full hover:bg-indigo-400"></div>
            </div>
            <div id="pc-placeholder" class="h-full flex items-center justify-center text-slate-400">
                <span class="text-[10px] uppercase font-bold rotate-90 tracking-widest">DETAIL</span>
            </div>
            <div id="pc-detail-view" class="hidden h-full flex flex-col relative p-4">
                <div id="side-zoom-container" class="zoom-surface flex-grow bg-slate-50 rounded-2xl overflow-hidden">
                    <img id="side-lightbox-img" src="" alt="Side preview" class="w-full h-full object-contain">
                </div>
                <p id="side-lightbox-comment" class="mt-4 font-bold text-lg text-slate-800 break-words"></p>
                <span id="side-zoom-indicator" class="text-[10px] text-slate-400 mt-2">100%</span>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
